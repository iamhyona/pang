*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#1c1d22;color:var(--txt);font-family:var(--f);-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;touch-action:none}

.rb{display:grid;grid-template-columns:repeat(21,4px);grid-template-rows:4px 4px;gap:1px;flex-shrink:1;overflow:hidden}.rb i{display:block}.rb.r{transform:scaleX(-1)}

.chain span{color:var(--gold);font-size:12px;letter-spacing:.3em}

.logo{filter:drop-shadow(0 0 5px rgba(255,255,255,.12));max-width:100%}
.sub{color:var(--hi);font-size:15px;letter-spacing:.35em;margin-top:-4px}

.keys+.credit{margin-top:10px}

.credit{color:#6c6d7c;font-size:11px;text-align:center;line-height:1.7}

.st div{text-align:center;padding:10px 0;color:var(--sub);font-size:10px;letter-spacing:.06em}.st div+div{border-left:2px solid var(--line)}

.rk li{display:flex;gap:10px;padding:8px 12px;color:var(--hi);font-size:14px;border-top:1px solid #23242c;align-items:center}
.rk li em{font-style:normal;color:var(--gold);width:16px}.rk li small{color:#6c6d7c;font-size:11px}.rk li b{margin-left:auto;font-weight:400;color:var(--txt)}

.paused{font-size:28px;color:var(--hi);letter-spacing:.2em}

.fld{flex-direction:column;gap:8px}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rk(el){const l=rkLoad().slice(0,20);el.innerHTML=l.length?l.map((r,i)=>`<li class="${r.id===mine?"me":""}"><em>${i+1}</em>${esc(r.n)}<small>${r.c} COMBO</small>${r.m?`<i style="color:${{easy:"#ffd84d",normal:"#7fd9ff",hard:"#ff8aa0",master:"#c9a6ff"}[r.m]||"#d9d9e2"}">${r.m.toUpperCase()}</i>`:""}<b>${r.s.toLocaleString()}</b></li>`).join(""):`<li class="empty">아직 기록이 없어요</li>`}
$("nmF").addEventListener("submit",e=>{e.preventDefault();if(mine||score<=0)return;const n=($("nmI").value.trim()||"익명").slice(0,8);store.set("pang-name",n);
  const r={id:Date.now()+"",n,s:score,c:maxChain,l:stage,m:mode,d:new Date().toISOString().slice(0,10)};const a=rkLoad();a.push(r);a.sort((x,y)=>y.s-x.s);store.set(RK,JSON.stringify(a.slice(0,50)));mine=r.id;$("nmF").classList.add("saved");rk($("rkL"));$("nmI").blur()});
PHVS.init({id:'pang',name:()=>store.get("pang-name")||"",setName:n=>store.set("pang-name",n),score:()=>score,
 start:()=>{mode="normal";vsGb=0;vsAtk=0;["startOv","modeOv","overOv","pauseOv","rankOv"].forEach(i=>$(i).hidden=true);start();showChain("VS START!","연쇄로 방해 블록 보내기")},
 data:d=>{if(d.t==="gb"&&state==="play"){vsGb+=d.n;showChain("WARNING",d.n+"줄 올라와요!")}},
 stop:()=>{state="over";cur=null;bgmStop()},leave:()=>home()});
$("vsB").onclick=()=>{unlockAudio();PHVS.menu()};
$("startB").onclick=()=>{$("startOv").hidden=true;$("modeOv").hidden=false};$("modeX").onclick=()=>{$("modeOv").hidden=true;$("startOv").hidden=false};
document.querySelectorAll("#modeOv [data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;store.set("pang-mode",mode);phTut("pang-tut",{"goal": "같은 모양 4개가 붙으면 팡! 연달아 터지면 콤보.<br>맨 위까지 쌓이면 게임 끝!", "touch": [["← 밀기 →", "옮기기"], ["탭", "돌리기"], ["↓ 천천히 밀기", "천천히 내리기"], ["↓ 튕기기", "바로 내리기"]], "pc": [["← →", "옮기기"], ["↑ / X / Z", "돌리기"], ["↓", "천천히 내리기"], ["SPACE", "바로 내리기"]]},start)});$("againB").onclick=start;$("homeB").onclick=home;
$("rankB").onclick=()=>{rk($("rkL2"));$("rankOv").hidden=false};$("rankClose").onclick=()=>$("rankOv").hidden=true;
$("pauseB").onclick=()=>pause(state==="play");$("resumeB").onclick=()=>pause(false);$("quitB").onclick=()=>{$("pauseOv").hidden=true;gameOver()};
$("restartB").onclick=()=>{if(state==="play"||state==="pause"||state==="over")start()};
$("bgmB").onclick=()=>{bgmOn=!bgmOn;store.set("pang-bgm",bgmOn?"1":"0");bgmBtn();if(bgmOn&&state==="play")bgmPlay();else bgmStop()};bgmBtn();
$("sfxB").onclick=()=>{sfxOn=!sfxOn;store.set("pang-sfx",sfxOn?"1":"0");bgmBtn();unlockAudio();if(sfxOn)tone("sine",660,880,.1,.03)};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play")pause(true)});
addEventListener("resize",layout);
hud();layout();requestAnimationFrame(tick);setTimeout(layout,300);
</script>
