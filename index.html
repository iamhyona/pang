<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="박현아가 심심해서 만든 비상업적 용도 연쇄 퍼즐 게임. 같은 모양 넷이면 팡!">
<meta property="og:type" content="website">
<meta property="og:title" content="방울팡팡">
<meta property="og:description" content="박현아가 심심해서 만든 비상업적 용도 연쇄 퍼즐 게임. 같은 모양 넷이면 팡!">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://iamhyona.github.io/pang/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0f">

<title>방울팡팡</title>
<style>
@font-face{font-family:"NeoDunggeunmo";src:url(https://cdn.jsdelivr.net/npm/@kfonts/neodgm@0.5.0/neodgm.woff2) format("woff2");font-display:block}
:root{--bg:#0b0b0f;--scr:#14151a;--line:#2c2d36;--line2:#363743;--txt:#f2f2f7;--sub:#8f90a0;--hi:#d9d9e2;--gold:#f2b000;--red:#ff3b5c;--f:"NeoDunggeunmo",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#1c1d22;color:var(--txt);font-family:var(--f);-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;touch-action:none}
.ph{position:fixed;inset:0;margin:auto;width:100%;max-width:460px;height:100%;max-height:940px;background:var(--bg);display:flex;flex-direction:column;padding:6px 8px 8px}
@media (min-width:520px){.ph{border-radius:30px;height:calc(100% - 32px);box-shadow:0 20px 50px rgba(0,0,0,.55)}}
.hd{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px 4px 8px;color:#c9c9d4;font-size:11px;letter-spacing:.1em;white-space:nowrap}
.rb{display:grid;grid-template-columns:repeat(21,4px);grid-template-rows:4px 4px;gap:1px;flex-shrink:1;overflow:hidden}.rb i{display:block}.rb.r{transform:scaleX(-1)}
@media (max-width:370px){.rb{grid-template-columns:repeat(14,4px)}}
.scr{position:relative;flex:1;min-height:0;border-radius:20px;border:2px solid #25262e;display:flex;flex-direction:column;align-items:center;padding:10px 10px 12px;gap:10px;
background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.5px),radial-gradient(130% 90% at 50% 40%,#1a1b21,#0e0f13 80%);background-size:25px 25px,auto;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;width:100%}
.ttl{color:var(--hi);font-size:16px;letter-spacing:.2em}
.ic{width:36px;height:36px;border:2px solid var(--line2);border-radius:10px;display:grid;place-items:center;background:#141519;cursor:pointer;padding:0}
.ic svg{width:14px;height:14px}
.ics{display:flex;gap:6px}
.fld{position:relative;flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-end}
.well{position:relative;border:2px solid var(--line);border-radius:10px;background:rgba(0,0,0,.25);padding:3px}
#cv{display:block}
.chain{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;pointer-events:none;opacity:0}
.chain b{display:block;font-weight:400;font-size:40px;color:#fff;text-shadow:0 0 10px #f2b000,0 0 22px rgba(242,176,0,.6)}
.chain span{color:var(--gold);font-size:12px;letter-spacing:.3em}
.chain.on{animation:cp 1s ease-out forwards}
@keyframes cp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.info{width:100%;display:grid;grid-template-columns:auto 1fr 1fr 1fr;border:2px solid var(--line2);border-radius:12px;background:linear-gradient(180deg,#1d1e25,#141519);overflow:hidden;flex-shrink:0}
.info>div{padding:7px 6px;text-align:center;color:var(--sub);font-size:10px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.info>div+div{border-left:1.5px solid var(--line)}
.info b{color:var(--txt);font-size:19px;font-weight:400;text-shadow:0 0 6px rgba(255,255,255,.18)}
#nx{display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(10,11,14,.9);z-index:5;overflow:auto}
.ov[hidden]{display:none}
.logo{filter:drop-shadow(0 0 5px rgba(255,255,255,.12));max-width:100%}
.sub{color:var(--hi);font-size:15px;letter-spacing:.35em;margin-top:-4px}
.show{display:flex;gap:2px;margin:4px 0 6px}
.show img{width:36px;height:36px}
.ob{width:232px;max-width:100%;height:48px;border:3px solid #5d5f70;box-shadow:inset 0 0 0 3px #101116,inset 0 0 0 5px #2a2b33;background:#131419;color:var(--txt);font-family:var(--f);font-size:16px;letter-spacing:.18em;cursor:pointer}
.ob.gold{border-color:#d9a400;box-shadow:none;color:var(--gold);height:44px}
.ob.red{border-color:#e8284f;color:#ff8aa0;box-shadow:none;height:44px}
.ob:active{transform:translateY(2px)}
.keys{color:var(--sub);font-size:12px;display:grid;grid-template-columns:auto auto;gap:6px 8px;align-items:center;margin-top:4px}
.keys kbd{font-family:var(--f);border:1.5px solid #4a4b58;border-radius:6px;padding:4px 7px;color:var(--hi);font-size:12px;justify-self:end}
.credit{color:#6c6d7c;font-size:11px;text-align:center;line-height:1.7}
.go{font-size:46px;color:var(--red);text-shadow:0 0 12px rgba(255,59,92,.6);line-height:1.1;text-align:center;letter-spacing:.05em}
.st{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:310px;border:2px solid var(--line2);border-radius:10px;background:#141519}
.st div{text-align:center;padding:10px 0;color:var(--sub);font-size:10px;letter-spacing:.06em}.st div+div{border-left:2px solid var(--line)}
.st b{display:block;color:var(--txt);font-size:21px;font-weight:400;margin-top:6px}
.nm{display:flex;gap:8px;justify-content:center}
.nm input{width:150px;height:42px;border:2px solid #4a4b58;border-radius:8px;color:var(--txt);background:#101116;font-family:var(--f);font-size:16px;padding:0 12px;outline:none;user-select:text;-webkit-user-select:text}
.nm button{height:42px;padding:0 14px;border:0;border-radius:8px;background:linear-gradient(180deg,#f0405f,#c41d3f);color:#fff;font-family:var(--f);font-size:14px;cursor:pointer}
.nm.saved{opacity:.45;pointer-events:none}
.rk{width:100%;max-width:310px;border:2px solid var(--line2);border-radius:10px;overflow:hidden;flex-shrink:0}
.rk h4{margin:0;padding:8px 12px;background:#1d1e25;color:var(--gold);font-weight:400;font-size:12px;letter-spacing:.12em}
.rk ol{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto}
.rk li{display:flex;gap:10px;padding:8px 12px;color:var(--hi);font-size:14px;border-top:1px solid #23242c;align-items:center}
.rk li em{font-style:normal;color:var(--gold);width:16px}.rk li small{color:#6c6d7c;font-size:11px}.rk li b{margin-left:auto;font-weight:400;color:var(--txt)}
.rk li.me{background:rgba(242,176,0,.08)}.rk li.empty{justify-content:center;color:#6c6d7c;font-size:12px}
.row{display:flex;gap:10px;width:100%;max-width:310px}.row .ob{flex:1;width:auto;font-size:14px;letter-spacing:.12em;height:46px}
.paused{font-size:28px;color:var(--hi);letter-spacing:.2em}
</style>
</head>
<body>
<div class="ph">
  <div class="hd"><span class="rb" id="rb1"></span><span>© 2026 PARK HYONA</span><span class="rb r" id="rb2"></span></div>
  <div class="scr" id="scr">
    <div class="top"><span class="ttl">방울<b style="font-weight:400;color:#ff7a6a">팡</b><b style="font-weight:400;color:#5aa8f2">팡</b></span>
      <span class="ics"><button class="ic" id="pauseB" aria-label="일시정지"><svg viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="3" height="11" fill="#d9d9e2"/><rect x="9.5" y="2.5" width="3" height="11" fill="#d9d9e2"/></svg></button><button class="ic" id="restartB" aria-label="다시하기"><svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 0 5.2 3.7" stroke="#d9d9e2" stroke-width="2" fill="none"/><path d="M13.8 2v4.6H9.2" fill="#d9d9e2"/></svg></button></span></div>
    <div class="fld" id="fld"><div class="well"><canvas id="cv"></canvas></div><div class="chain" id="chain"><b id="chainT">2 연쇄!</b><span>CHAIN BONUS</span></div></div>
    <div class="info"><div><span>NEXT</span><canvas id="nx"></canvas></div><div>STAGE<b id="stg">001</b></div><div>SCORE<b id="sc">0</b></div><div>CHAIN<b id="ch">00</b></div></div>

    <div class="ov" id="startOv">
      <div id="logo"></div><div class="sub">방울팡팡</div>
      <div class="show" id="show"></div>
      <button class="ob" id="startB">SINGLE PLAY</button>
      <button class="ob gold" id="rankB">RANKING</button>
      <div class="keys"><kbd>← 밀기 →</kbd><span>이동</span><kbd>탭</kbd><span>돌리기</span><kbd>↓ 천천히 밀기</kbd><span>천천히</span><kbd>↓ 튕기기</kbd><span>바로 내리기</span></div>
      <div class="credit">이 게임은 서울 마포구에 사는 박현아가 만든<br>비상업용 게임이에요. 같은 색 방울 넷이면 팡!</div>
    </div>
    <div class="ov" id="pauseOv" hidden><div class="paused">PAUSE</div><button class="ob" id="resumeB">CONTINUE</button><button class="ob red" id="quitB">GIVE UP</button></div>
    <div class="ov" id="overOv" hidden>
      <div class="go">GAME<br>OVER</div>
      <div class="st"><div>SCORE<b id="oS">0</b></div><div>MAX 연쇄<b id="oC">0</b></div><div>STAGE<b id="oL">1</b></div></div>
      <form class="nm" id="nmF" autocomplete="off"><input id="nmI" maxlength="8" placeholder="이름" aria-label="이름"><button type="submit">랭킹 등록</button></form>
      <div class="rk"><h4>RANKING</h4><ol id="rkL"></ol></div>
      <div class="row"><button class="ob" id="againB">ONE MORE</button><button class="ob" id="homeB">HOME</button></div>
    </div>
    <div class="ov" id="rankOv" hidden><div class="rk"><h4>RANKING</h4><ol id="rkL2"></ol></div><button class="ob" id="rankClose">CLOSE</button></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* ---------- piece art (SVG) ---------- */
const COL={1:['#e8352e','#ff8a73','#a8170f'],2:['#efe6cf','#fffdf4','#b9a98a'],3:['#3e8fe6','#9fd3ff','#1c58ad'],4:['#f6a51e','#ffe08a','#c06a00'],5:['#e264c4','#ffc0ee','#a32c8a'],6:['#9aa0ad','#e3e7ef','#5f6573'],7:['#3fc9b0','#b4f5e6','#178a74']};
const star=(cx,cy,R,r)=>'M'+[...Array(10)].map((_,k)=>{const a=-Math.PI/2+k*Math.PI/5,q=k%2?r:R;return (cx+q*Math.cos(a)).toFixed(2)+' '+(cy+q*Math.sin(a)).toFixed(2)}).join(' L')+'Z';
const hexa=(cx,cy,R)=>'M'+[...Array(6)].map((_,k)=>{const a=Math.PI/6+k*Math.PI/3;return (cx+R*Math.cos(a)).toFixed(2)+' '+(cy+R*Math.sin(a)).toFixed(2)}).join(' L')+'Z';
const SH={1:'<path d="M20 35.5C7.5 29 3.2 22.5 3.2 15.2C3.2 8.6 7.6 4.2 13 4.2C16.3 4.2 18.7 6 20 8.6C21.3 6 23.7 4.2 27 4.2C32.4 4.2 36.8 8.6 36.8 15.2C36.8 22.5 32.5 29 20 35.5Z"/>',
2:'<circle cx="20" cy="10.5" r="9"/><circle cx="29.5" cy="20" r="9"/><circle cx="20" cy="29.5" r="9"/><circle cx="10.5" cy="20" r="9"/><rect x="8" y="8" width="24" height="24" rx="7"/>',
3:'<path d="M20 4C27 11.5 36.5 16.5 36.5 25C36.5 32.6 29.6 37 20 37C10.4 37 3.5 32.6 3.5 25C3.5 16.5 13 11.5 20 4Z"/>',
4:'<path d="'+star(20,21.3,16.2,11.6)+'"/>',5:'<path d="'+hexa(20,20.3,16.2)+'"/>',
6:'<circle cx="12.5" cy="22" r="9.3"/><circle cx="21" cy="14.5" r="10.6"/><circle cx="29" cy="21.5" r="9"/><rect x="5" y="20" width="30.5" height="14.5" rx="7.2"/>',
7:'<rect x="4" y="4.5" width="32" height="31.5" rx="15"/>'};
const SW={1:3.5,2:2,3:3.5,4:9,5:10,6:2,7:2},FY={1:-1,2:0,3:4,4:2,5:0,6:3,7:0},CT={1:[.5,.42],2:[.5,.45],3:[.5,.62],4:[.5,.55],5:[.5,.48],6:[.5,.5],7:[.5,.45]};
function face(dy,mood){const o='#2a1712';
  const eyes=mood==='x'?`<path d="M14.2 16l3.6 3.6M17.8 16l-3.6 3.6M22.2 16l3.6 3.6M25.8 16l-3.6 3.6" stroke="${o}" stroke-width="1.6" stroke-linecap="round"/>`
   :`<ellipse cx="16" cy="17.6" rx="1.7" ry="2.3" fill="${o}"/><ellipse cx="24" cy="17.6" rx="1.7" ry="2.3" fill="${o}"/><ellipse cx="16.4" cy="16.8" rx=".55" ry=".7" fill="#fff" opacity=".8"/><ellipse cx="24.4" cy="16.8" rx=".55" ry=".7" fill="#fff" opacity=".8"/>`;
  const mouth=mood==='x'?`<ellipse cx="20" cy="23.5" rx="2" ry="1.6" fill="${o}"/>`:`<path d="M15.6 21.4Q20 26.6 24.4 21.4Q20 23.4 15.6 21.4Z" fill="${o}" stroke="${o}" stroke-width="1.2" stroke-linejoin="round"/>`;
  return `<g transform="translate(0 ${dy})">${eyes}${mouth}</g>`}
function pieceSVG(c,mood){const [b,l,d]=COL[c],sh=SH[c],w=SW[c],[cx,cy]=CT[c];
  const body=f=>`<g fill="${f}" stroke="${f}" stroke-width="${w}" stroke-linejoin="round">${sh}</g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 44 44" width="88" height="88"><defs><radialGradient id="g" cx="${cx}" cy="${cy}" r=".62"><stop offset="0" stop-color="${l}"/><stop offset=".5" stop-color="${b}"/><stop offset=".86" stop-color="${b}"/><stop offset="1" stop-color="${d}"/></radialGradient><mask id="m" maskUnits="userSpaceOnUse" x="-5" y="-5" width="50" height="50">${body('#fff')}</mask><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".9"/></filter></defs><g fill="#231510" stroke="#231510" stroke-width="${w+3.2}" stroke-linejoin="round">${sh}</g>${body('url(#g)')}<g mask="url(#m)"><g fill="none" stroke="${d}" stroke-width="3" stroke-linejoin="round" transform="translate(0 1.3)" opacity=".55" filter="url(#s)">${sh}</g><ellipse cx="13.5" cy="9.5" rx="5.2" ry="2.6" transform="rotate(-28 13.5 9.5)" fill="#fff" opacity=".85" filter="url(#s)"/><circle cx="9.5" cy="14" r="1.1" fill="#fff" opacity=".7"/></g>${face(FY[c],mood)}</svg>`}
const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const IMG={},IMGX={};let artReady=0;
for(let c=1;c<=7;c++){for(const [store_,mood] of [[IMG,''],[IMGX,'x']]){const im=new Image();im.onload=()=>{artReady++;draw();drawNext()};im.src=svgURL(pieceSVG(c,mood));store_[c]=im}}
/* ---------- deco ---------- */
const RBC=['#e8284f','#f26a0d','#f2b000','#10b870','#00a8e0','#2f6bf0','#8a3cf0'];
$("rb1").innerHTML=$("rb2").innerHTML=RBC.flatMap(c=>Array(6).fill(`<i style="background:${c}"></i>`)).join("");
(function logo(){const L={P:"11110100011000111110100001000010000",A:"01110100011000111111100011000110001",N:"10001110011010110011100011000110001",G:"01111100001000010111100011000101111"};
  const cell=12,w="PANG".length*6*cell-cell;let o="";[..."PANG"].forEach((ch,i)=>{const g=L[ch];for(let y=0;y<7;y++)for(let x=0;x<5;x++){const on=g[y*5+x]==="1";o+=`<circle cx="${i*6*cell+x*cell+cell/2}" cy="${y*cell+cell/2}" r="${cell*.38}" fill="${on?RBC[i*2%7]:"rgba(255,255,255,.06)"}"/>`}});
  $("logo").innerHTML=`<svg class="logo" width="${w}" height="${7*cell}" viewBox="0 0 ${w} ${7*cell}">${o}</svg>`})();
$("show").innerHTML=[1,2,3,4,5,6,7].map(c=>`<img alt="" src="${svgURL(pieceSVG(c))}">`).join("");
/* ---------- game ---------- */
const COLS=6,ROWS=13,HID=1;
const CP=[0,0,8,16,32,64,96,128,160,192,224,256,288,320,352,384,416,448,480,512];
const GB=n=>n<5?0:n>=11?10:n-3;
const CB=[0,0,3,6,12,24,36,48];
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const cv=$("cv"),cx=cv.getContext("2d"),nx=$("nx"),nc=nx.getContext("2d");
let CS=40,DPR=1,G=null,cur=null,queue=null,score=0,maxChain=0,stage=1,popped=0,state=null,lastT=0,fallAcc=0,lockT=0,lockMoves=0,soft=false,anim=null;
const nColors=()=>stage<3?4:stage<6?5:stage<9?6:7;
const rnd=()=>1+(Math.random()*nColors()|0);
const pad=(n,l)=>String(n).padStart(l,"0");
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  const f=$("fld").getBoundingClientRect();
  CS=Math.max(20,Math.floor(Math.min((f.width-10)/COLS,(f.height-10)/(ROWS-HID))));
  const w=CS*COLS,h=CS*(ROWS-HID);cv.width=w*DPR;cv.height=h*DPR;cv.style.width=w+"px";cv.style.height=h+"px";
  nx.width=60*DPR;nx.height=46*DPR;nx.style.width="60px";nx.style.height="46px";
  draw();drawNext();
}
function reset(){G=Array.from({length:ROWS},()=>Array(COLS).fill(0));score=0;maxChain=0;stage=1;popped=0;anim=null;queue=[[rnd(),rnd()],[rnd(),rnd()]];spawn();hud()}
function spawn(){const p=queue.shift();queue.push([rnd(),rnd()]);cur={x:2,y:1,r:0,c:p};lockT=0;lockMoves=0;fallAcc=0;if(G[1][2]){gameOver();return}drawNext()}
const cells=p=>{const d=DIRS[p.r];return [[p.x,p.y,p.c[0]],[p.x+d[0],p.y+d[1],p.c[1]]]};
const free=(x,y)=>x>=0&&x<COLS&&y<ROWS&&(y<0||!G[y][x]);
const fits=p=>cells(p).every(([x,y])=>free(x,y));
function tryMove(dx,dy){const n={...cur,x:cur.x+dx,y:cur.y+dy};if(fits(n)){cur=n;return true}return false}
function bumpLock(){if(lockT>0&&lockMoves<12){lockT=0;lockMoves++}}
function rotate(dir){const n={...cur,r:(cur.r+dir+4)%4};if(fits(n)){cur=n;bumpLock();return}
  const d=DIRS[n.r],k={...n,x:n.x-d[0],y:n.y-d[1]};if(fits(k)){cur=k;bumpLock();return}
  const f={...cur,r:(cur.r+2)%4},fd=DIRS[f.r],f2={...f,x:f.x-fd[0],y:f.y-fd[1]};if(fits(f)){cur=f;bumpLock()}else if(fits(f2)){cur=f2;bumpLock()}}
const grounded=()=>!fits({...cur,y:cur.y+1});
function hardDrop(){let n=0;while(tryMove(0,1))n++;score+=n*2;lock()}
function lock(){for(const [x,y,c] of cells(cur))if(y>=0)G[y][x]=c;cur=null;resolve(1)}
function dropCells(){const mv=[];for(let x=0;x<COLS;x++){let w=ROWS-1;for(let y=ROWS-1;y>=0;y--)if(G[y][x]){if(w!==y){mv.push({x,from:y,to:w,c:G[y][x]});G[w][x]=G[y][x];G[y][x]=0}w--}}return mv}
function groups(){const seen=Array.from({length:ROWS},()=>Array(COLS).fill(false)),out=[];
  for(let y=HID;y<ROWS;y++)for(let x=0;x<COLS;x++){const c=G[y][x];if(!c||seen[y][x])continue;const st=[[x,y]],g=[];seen[y][x]=true;
    while(st.length){const [a,b]=st.pop();g.push([a,b]);for(const [dx,dy] of DIRS){const u=a+dx,v=b+dy;if(u>=0&&u<COLS&&v>=HID&&v<ROWS&&!seen[v][u]&&G[v][u]===c){seen[v][u]=true;st.push([u,v])}}}
    if(g.length>=4)out.push({c,g})}return out}
function resolve(chain){
  const mv=dropCells();
  const after=()=>{const gs=groups();
    if(!gs.length){if(chain>1&&G.every(r=>r.every(v=>!v))){score+=2100;showChain("ALL CLEAR","+2100")}hud();if(state==="play"||state==="pause")spawn();return}
    const n=gs.reduce((a,g)=>a+g.g.length,0),colors=new Set(gs.map(g=>g.c)).size;
    const bonus=Math.max(1,Math.min(999,(CP[Math.min(chain,CP.length-1)]||0)+gs.reduce((a,g)=>a+GB(g.g.length),0)+CB[colors]));
    score+=10*n*bonus;popped+=n;if(chain>maxChain)maxChain=chain;
    const ns=1+Math.floor(popped/40);if(ns>stage){stage=ns;if(chain<2)showChain("STAGE "+pad(stage,3),"SPEED UP")}
    if(chain>=2)showChain(chain+" 연쇄!","CHAIN BONUS");sfx(chain);
    anim={type:"pop",t:0,dur:420,cells:gs.flatMap(g=>g.g),done:()=>{for(const [x,y] of anim.cells)G[y][x]=0;anim=null;hud();resolve(chain+1)}}};
  if(mv.length)anim={type:"fall",t:0,dur:Math.min(260,90+Math.max(...mv.map(m=>m.to-m.from))*28),moves:mv,done:()=>{anim=null;after()}};else after()}
function showChain(a,b){const e=$("chain");$("chainT").textContent=a;e.querySelector("span").textContent=b;e.classList.remove("on");void e.offsetWidth;e.classList.add("on")}
let AC=null;
function sfx(chain){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type="square";const f=440*Math.pow(2,Math.min(chain-1,12)/6);o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+.08);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(AC.destination);o.start();o.stop(t+.2)}catch(e){}}
const speed=()=>Math.max(90,800-(stage-1)*70);
function tick(t){requestAnimationFrame(tick);const dt=Math.min(50,t-(lastT||t));lastT=t;
  if(state==="play"){
    if(anim){anim.t+=dt;if(anim.t>=anim.dur)anim.done()}
    else if(cur){if(grounded()){lockT+=dt;if(lockT>(soft?120:450))lock()}else{lockT=0;fallAcc+=dt*(soft?16:1);const sp=speed();while(fallAcc>=sp){fallAcc-=sp;if(!tryMove(0,1))break;if(soft)score+=1}}}
  }
  draw()}
function piece(c,x,y,s,alpha,mood){const im=(mood?IMGX:IMG)[c];if(!im||!im.complete)return;const z=s*1.1;cx.globalAlpha=alpha??1;cx.drawImage(im,x+(s-z)/2,y+(s-z)/2,z,z);cx.globalAlpha=1}
function draw(){const c=cx;c.setTransform(DPR,0,0,DPR,0,0);const w=CS*COLS,h=CS*(ROWS-HID);c.clearRect(0,0,w,h);
  c.fillStyle="rgba(255,255,255,.09)";for(let y=0;y<ROWS-HID;y++)for(let x=0;x<COLS;x++){c.beginPath();c.arc(x*CS+CS/2,y*CS+CS/2,1.4,0,7);c.fill()}
  c.strokeStyle="rgba(255,90,110,.35)";c.lineWidth=1.5;c.setLineDash([3,3]);c.beginPath();c.moveTo(2*CS+4,2);c.lineTo(3*CS-4,2);c.stroke();c.setLineDash([]);
  if(!G)return;
  const hide=new Set(),pop=new Set();
  if(anim&&anim.type==="fall")for(const m of anim.moves)hide.add(m.x+","+m.to);
  if(anim&&anim.type==="pop")for(const [x,y] of anim.cells)pop.add(x+","+y);
  for(let y=HID;y<ROWS;y++)for(let x=0;x<COLS;x++){const v=G[y][x];if(!v||hide.has(x+","+y))continue;const px=x*CS,py=(y-HID)*CS;
    if(pop.has(x+","+y)){const p=anim.t/anim.dur,s=CS*(1+Math.sin(p*Math.PI)*.22);piece(v,px-(s-CS)/2,py-(s-CS)/2,s,1-Math.max(0,p-.55)*2.2,"x");
      const gr=c.createRadialGradient(px+CS/2,py+CS/2,0,px+CS/2,py+CS/2,CS*.7);gr.addColorStop(0,`rgba(255,255,255,${.85*Math.sin(p*Math.PI)})`);gr.addColorStop(1,"rgba(255,255,255,0)");c.fillStyle=gr;c.fillRect(px-CS*.2,py-CS*.2,CS*1.4,CS*1.4);continue}
    piece(v,px,py,CS)}
  if(anim&&anim.type==="fall"){const p=Math.min(1,anim.t/anim.dur),e=p*p;for(const m of anim.moves){const y=m.from+(m.to-m.from)*e;if(y<HID-.5)continue;piece(m.c,m.x*CS,(y-HID)*CS,CS)}}
  if(cur&&state!=="over"){let gy=0;while(fits({...cur,y:cur.y+gy+1}))gy++;
    if(gy>0){c.strokeStyle="rgba(255,255,255,.35)";c.lineWidth=2;c.setLineDash([4,4]);for(const [x,y] of cells({...cur,y:cur.y+gy}))if(y>=HID){c.beginPath();c.arc(x*CS+CS/2,(y-HID)*CS+CS/2,CS*.32,0,7);c.stroke()}c.setLineDash([])}
    c.save();c.shadowColor="rgba(255,255,255,.55)";c.shadowBlur=10;for(const [x,y,col] of cells(cur))if(y>=HID)piece(col,x*CS,(y-HID)*CS,CS);c.restore()}}
function drawNext(){const c=nc;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,60,46);if(!queue)return;
  const dr=(col,x,y,s,a)=>{const im=IMG[col];if(im&&im.complete){c.globalAlpha=a;c.drawImage(im,x,y,s,s);c.globalAlpha=1}};
  dr(queue[0][1],2,0,24,1);dr(queue[0][0],2,22,24,1);dr(queue[1][1],34,10,18,.55);dr(queue[1][0],34,27,18,.55)}
function hud(){$("sc").textContent=score.toLocaleString();$("stg").textContent=pad(stage,3);$("ch").textContent=pad(maxChain,2)}
/* ---------- input ---------- */
function act(k){if(state!=="play"||!cur||anim)return;
  if(k==="L"){if(tryMove(-1,0))bumpLock()}else if(k==="R"){if(tryMove(1,0))bumpLock()}else if(k==="CW")rotate(1);else if(k==="CCW")rotate(-1);else if(k==="H")hardDrop()}
const KEYS={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"CW",x:"CW",X:"CW",z:"CCW",Z:"CCW"," ":"H"},held={};
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(e.key==="p"||e.key==="P"||e.key==="Escape"){if(state==="play"||state==="pause")pause(state==="play");return}
  if(e.key==="Enter"&&!$("startOv").hidden){start();return}
  if(e.key==="ArrowDown"){soft=true;e.preventDefault();return}
  const k=KEYS[e.key];if(!k)return;e.preventDefault();
  if(k==="L"||k==="R"){if(held[k])return;held[k]=1;act(k);held[k+"t"]=setTimeout(()=>{held[k+"i"]=setInterval(()=>act(k),55)},170)}else if(!e.repeat)act(k)});
addEventListener("keyup",e=>{if(e.key==="ArrowDown")soft=false;const k=KEYS[e.key];if(k&&held[k]){held[k]=0;clearTimeout(held[k+"t"]);clearInterval(held[k+"i"])}});
let sw=null;const scr=$("scr");
scr.addEventListener("pointerdown",e=>{if(state!=="play"||e.target.closest("button,.ov"))return;sw={x:e.clientX,y:e.clientY,t:performance.now(),mx:0,moved:false,ly:e.clientY,lt:performance.now(),vy:0};try{scr.setPointerCapture(e.pointerId)}catch(_){}});
scr.addEventListener("pointermove",e=>{if(!sw)return;const st=CS*.85,dx=e.clientX-sw.x,steps=Math.trunc(dx/st);
  while(steps>sw.mx){act("R");sw.mx++;sw.moved=true}while(steps<sw.mx){act("L");sw.mx--;sw.moved=true}
  const now=performance.now();sw.vy=(e.clientY-sw.ly)/Math.max(1,now-sw.lt);sw.ly=e.clientY;sw.lt=now;
  const dy=e.clientY-sw.y;if(dy>CS*.8&&Math.abs(dx)<CS*.8){soft=true;sw.moved=true}});
scr.addEventListener("pointerup",e=>{if(!sw)return;const dy=e.clientY-sw.y,dt=performance.now()-sw.t;soft=false;
  if(dy>CS*1.4&&(dt<220||sw.vy>.9))act("H");else if(!sw.moved&&Math.abs(dy)<CS*.5&&dt<350)act("CW");sw=null});
scr.addEventListener("pointercancel",()=>{sw=null;soft=false});
/* ---------- flow ---------- */
function start(){["startOv","overOv","pauseOv","rankOv"].forEach(i=>$(i).hidden=true);reset();state="play";lastT=0;layout();try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function pause(on){if(!G||state==="over")return;state=on?"pause":"play";$("pauseOv").hidden=!on;lastT=0}
function gameOver(){state="over";cur=null;const best=+(store.get("pang-best")||0);if(score>best)store.set("pang-best",score);
  $("oS").textContent=score.toLocaleString();$("oC").textContent=maxChain;$("oL").textContent=stage;
  $("nmI").value=store.get("pang-name")||"";$("nmF").classList.toggle("saved",score<=0);mine=null;rk($("rkL"));setTimeout(()=>{$("overOv").hidden=false},600);hud()}
function home(){state=null;G=null;cur=null;queue=null;anim=null;["overOv","pauseOv","rankOv"].forEach(i=>$(i).hidden=true);$("startOv").hidden=false;score=0;maxChain=0;stage=1;hud();draw();drawNext()}
const RK="pang-rank";let mine=null;
const rkLoad=()=>{try{return JSON.parse(store.get(RK)||"[]")}catch(e){return[]}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rk(el){const l=rkLoad().slice(0,20);el.innerHTML=l.length?l.map((r,i)=>`<li class="${r.id===mine?"me":""}"><em>${i+1}</em>${esc(r.n)}<small>${r.c}연쇄</small><b>${r.s.toLocaleString()}</b></li>`).join(""):`<li class="empty">아직 기록이 없어요</li>`}
$("nmF").addEventListener("submit",e=>{e.preventDefault();if(mine||score<=0)return;const n=($("nmI").value.trim()||"익명").slice(0,8);store.set("pang-name",n);
  const r={id:Date.now()+"",n,s:score,c:maxChain,l:stage,d:new Date().toISOString().slice(0,10)};const a=rkLoad();a.push(r);a.sort((x,y)=>y.s-x.s);store.set(RK,JSON.stringify(a.slice(0,50)));mine=r.id;$("nmF").classList.add("saved");rk($("rkL"));$("nmI").blur()});
$("startB").onclick=start;$("againB").onclick=start;$("homeB").onclick=home;
$("rankB").onclick=()=>{rk($("rkL2"));$("rankOv").hidden=false};$("rankClose").onclick=()=>$("rankOv").hidden=true;
$("pauseB").onclick=()=>pause(state==="play");$("resumeB").onclick=()=>pause(false);$("quitB").onclick=()=>{$("pauseOv").hidden=true;gameOver()};
$("restartB").onclick=()=>{if(state==="play"||state==="pause"||state==="over")start()};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play")pause(true)});
addEventListener("resize",layout);
hud();layout();requestAnimationFrame(tick);
</script>
